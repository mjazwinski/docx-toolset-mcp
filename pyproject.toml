[build-system]

requires = ["hatchling"]

build-backend = "hatchling.build"



[project]

name = "docx-toolset-mcp"

version = "0.1.0"

description = "MCP server for DOCX document management"

readme = "README.md"

requires-python = ">=3.11"

license = { text = "MIT" }

keywords = ["mcp", "docx", "document", "word"]

dependencies = [

    "mcp[cli]>=2.0.0",

    "python-docx>=1.1.0",
    "sumy>=0.9.1",
    "langdetect>=1.0.9",
    "nltk>=3.8",

]



[project.optional-dependencies]

dev = [

    "pyright>=1.1.390",

    "ruff>=0.8.0",

    "pytest>=8.0.0",

    "pytest-asyncio>=0.24.0",

]



[project.scripts]

docx-toolset-mcp = "docx_toolset_mcp.server:main"



# ---------------------------------------------------------------------------

# Hatch build

# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]

packages = ["src/docx_toolset_mcp"]



# ---------------------------------------------------------------------------

# Pyright / Pylance — strict mode so all type errors surface in the editor

# ---------------------------------------------------------------------------

[tool.pyright]

include = ["src"]

pythonVersion = "3.11"

typeCheckingMode = "strict"

reportMissingImports = true

reportMissingTypeStubs = false   # python-docx ships no stubs; suppress noise



# ---------------------------------------------------------------------------

# Ruff

# ---------------------------------------------------------------------------

[tool.ruff]

line-length = 100

target-version = "py311"



[tool.ruff.lint]

select = ["E", "F", "I", "UP", "B", "SIM"]



# ---------------------------------------------------------------------------

# Pytest

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]

asyncio_mode = "auto"

testpaths = ["tests"]

